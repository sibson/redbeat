name: Feature request
description: Suggest a change or addition to RedBeat
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The underlying goal, not just the proposed API. Knowing the problem
        often surfaces a way to solve it that already exists.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like RedBeat to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you're doing instead today
      description: Workarounds, subclassing, or another library.
